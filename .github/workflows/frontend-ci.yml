name: Mars Printer Hub React CI/CD

on:
  push:
    tags:
      - 'v*'  # 🔥 只有打 tag 才触发
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 拉取代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ 设置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ 缓存 node_modules
      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 4️⃣ 安装依赖 & 构建
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      # 5️⃣ 生成版本号（使用 tag）
      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}  # 直接取 tag 名
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # 6️⃣ 登录 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 7️⃣ 设置 Docker Buildx（支持多架构）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 8️⃣ 构建并推送多架构镜像到 Docker Hub
      - name: Build and push multi-arch image to Docker Hub
        run: |
          IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/mars-printer-hub-react
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --sbom=false \
            -t $IMAGE_NAME:${{ env.VERSION }} \
            -t $IMAGE_NAME:latest \
            --push .

      # 9️⃣ 登录阿里云 ACR
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
          registry: registry.cn-shenzhen.aliyuncs.com

      # 🔟 构建并推送多架构镜像到阿里云 ACR
      - name: Build and push multi-arch image to Aliyun ACR
        run: |
          ACR_IMAGE=registry.cn-shenzhen.aliyuncs.com/marsss/mars-printer-hub-react
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --sbom=false \
            -t $ACR_IMAGE:${{ env.VERSION }} \
            -t $ACR_IMAGE:latest \
            --push .
