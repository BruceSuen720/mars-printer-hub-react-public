server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://backend:8123/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
  }
  location = /config-remote/color.json {
    proxy_pass https://spool-r2.hcgl.top/color.json;
    proxy_ssl_server_name on;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = /config/color.json;
  }
  location = /config-remote/filaments.json {
    proxy_pass https://spool-r2.hcgl.top/filaments.json;
    proxy_ssl_server_name on;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = /config/filaments.json;
  }
  location = /config-remote/spoolConfig.json {
    proxy_pass https://spool-r2.hcgl.top/spoolConfig.json;
    proxy_ssl_server_name on;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = /config/spoolConfig.json;
  }
  location ^~ /config/ {
    try_files $uri =404;
  }
  location / {
    try_files $uri /index.html;
  }
}
