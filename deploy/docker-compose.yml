# Mars Printer Hub - 飞牛 NAS 部署编排
#
# 目录结构:
#   deploy/docker-compose.yml   本文件
#   deploy/nginx.conf           前端 nginx 配置（挂载进 frontend 容器）
#   deploy/sync-configs.sh      云端耗材配置 -> 本地缓存备份
#   deploy/.env.example          环境变量模板
#
# 用法:
#   cd deploy && cp .env.example .env && vi .env
#   docker compose up -d --build

services:
  mysql:
    image: mysql:8.0
    container_name: mars-printer-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mars_printer_hub}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置}
      TZ: Asia/Shanghai
    volumes:
      - ../mysql:/var/lib/mysql
    networks: [mars]

  redis:
    image: redis:7-alpine
    container_name: mars-printer-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ../redis:/data
    networks: [mars]

  backend:
    build: ../backend
    container_name: mars-printer-backend
    restart: unless-stopped
    depends_on: [mysql, redis]
    ports:
      - "${BACKEND_PORT:-18123}:8123"
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-mars_printer_hub}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      BAMBU_CLOUD_ENABLED: ${BAMBU_CLOUD_ENABLED:-false}
      BAMBU_MQTT_INIT_ALL: ${BAMBU_MQTT_INIT_ALL:-false}
      BAMBU_INTRANET: ${BAMBU_INTRANET:-true}
    networks: [mars]

  frontend:
    build: ../frontend
    container_name: mars-printer-frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${FRONTEND_PORT:-18124}:80"
    volumes:
      # nginx.conf 必须以只读方式挂载；注意 $host / $uri 等 nginx 变量在写入时不要被 shell 展开
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../config-backup:/usr/share/nginx/html/config:ro
    networks: [mars]

networks:
  mars:
    name: mars-printer-hub
